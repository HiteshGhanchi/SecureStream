services:
  auth-postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: securestream_auth
    ports:
      - "5432:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securestream_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    ports:
      - "8080:8080"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build:
      context: ./auth
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@auth-postgres:5432/securestream_auth
      JWT_SECRET: local-development-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      OIDC_REDIRECT_BASE_URL: http://localhost:8000
    # Lets the seeded issuer URL (http://localhost:8080) reach Keycloak on the host.
    extra_hosts:
      - "localhost:host-gateway"
    volumes:
      - ./auth:/app
    ports:
      - "8000:8000"
    depends_on:
      auth-postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  api-gateway:
    build:
      context: ./api-gateway
    environment:
      JWT_SECRET: local-development-secret
      JWT_ALGORITHM: HS256
      REDIS_URL: redis://redis:6379/0
      AUTH_SERVICE_URL: http://auth:8000
      RATE_LIMIT_REQUESTS: 60
      RATE_LIMIT_WINDOW_SECONDS: 60
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./api-gateway:/app
    ports:
      - "8001:8001"
    depends_on:
      auth:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  auth_postgres_data:
