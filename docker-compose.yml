# Local development stack. Every value below has a dev-only default so
# `make up` works without a .env file; override any of them in .env
# (see .env.example). Never reuse these defaults outside your machine.

x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 5s
  retries: 20
  start_period: 10s

services:
  auth-postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
      POSTGRES_DB: securestream_auth
    ports:
      - "${AUTH_DB_PORT:-5432}:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d securestream_auth"]

  media-postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: ${MEDIA_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${MEDIA_DB_PASSWORD:-postgres}
      POSTGRES_DB: mediastream_db
    ports:
      - "${MEDIA_DB_PORT:-5433}:5432"
    volumes:
      - media_postgres_data:/var/lib/postgresql
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d mediastream_db"]

  keycloak:
    # Dev only: plays the identity provider of the sample tenant companies.
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    healthcheck:
      <<: *healthcheck-defaults
      retries: 40
      # The image has no curl; probe the management port with bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3

  redis:
    image: redis:7.4.12-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]

  kafka:
    # Single-node KRaft broker. Containers use kafka:9094, the host uses localhost:9092.
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,CONTROLLER://:9093,INTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      <<: *healthcheck-defaults
      retries: 30
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9094 > /dev/null 2>&1"]

  kafka-init:
    # Creates the topics from ADR 0004 once, then exits.
    image: apache/kafka:4.3.2
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for t in video.uploaded video.processing video.ready video.failed video.dlq playback.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists \
            --topic "$$t" --partitions 3 --replication-factor 1
        done
        echo "topics ready"
    depends_on:
      kafka:
        condition: service_healthy

  object-storage:
    # S3-compatible storage for dev (SeaweedFS; MinIO no longer publishes images).
    # Buckets are private: only the dev identity in infra/seaweedfs/s3.json can read them.
    image: chrislusf/seaweedfs:4.53
    command: >-
      server -dir=/data -ip=object-storage -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024 -volume.max=0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - object_storage_data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "${S3_PORT:-8333}:8333"
    healthcheck:
      <<: *healthcheck-defaults
      retries: 30
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]

  object-storage-init:
    # Creates the buckets once, then exits.
    image: chrislusf/seaweedfs:4.53
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        existing=$$(echo "s3.bucket.list" | weed shell -master=object-storage:9333)
        for b in securestream-raw securestream-media; do
          if echo "$$existing" | grep -qw "$$b"; then
            echo "bucket $$b already exists"
          else
            echo "s3.bucket.create -name $$b" | weed shell -master=object-storage:9333
          fi
        done
    depends_on:
      object-storage:
        condition: service_healthy

  auth:
    build:
      context: ./auth
    environment:
      DATABASE_URL: postgresql+asyncpg://${AUTH_DB_USER:-postgres}:${AUTH_DB_PASSWORD:-postgres}@auth-postgres:5432/securestream_auth
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      OIDC_REDIRECT_BASE_URL: http://localhost:8000
    # Lets the seeded issuer URL (http://localhost:8080) reach Keycloak on the
    # host. Replaced by KC_HOSTNAME + backchannel config in F2/F3.
    extra_hosts:
      - "localhost:host-gateway"
    volumes:
      - ./auth:/app
    # Published only until F3 moves the OIDC callback behind the gateway.
    ports:
      - "8000:8000"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
    depends_on:
      auth-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      JWT_ALGORITHM: HS256
      REDIS_URL: redis://redis:6379/0
      AUTH_SERVICE_URL: http://auth:8000
      RATE_LIMIT_REQUESTS: 60
      RATE_LIMIT_WINDOW_SECONDS: 60
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./api-gateway:/app
    ports:
      - "8001:8001"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=3)"]
    depends_on:
      auth:
        condition: service_healthy
      redis:
        condition: service_healthy

  media-service:
    build:
      context: ./media-service
    environment:
      PORT: 8002
      DATABASE_URL: postgresql://${MEDIA_DB_USER:-postgres}:${MEDIA_DB_PASSWORD:-postgres}@media-postgres:5432/mediastream_db
    # Not published: reached through the gateway once F3 adds routing.
    expose:
      - "8002"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8002/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    depends_on:
      media-postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      object-storage-init:
        condition: service_completed_successfully

volumes:
  auth_postgres_data:
  media_postgres_data:
  kafka_data:
  object_storage_data:
