name: auth

on:
  push:
    branches: [main]
    paths: ["auth/**", ".github/workflows/auth.yml"]
  pull_request:
    paths: ["auth/**", ".github/workflows/auth.yml"]

permissions:
  contents: read

concurrency:
  group: auth-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: auth

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: securestream_auth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/securestream_auth_test
      JWT_SECRET: test-secret-not-real
      OIDC_REDIRECT_BASE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: auth/requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy app

      - name: Migrations apply cleanly
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Unit tests
        run: pytest -v -m "not integration"

      - name: Integration tests
        run: pytest -v -m integration
