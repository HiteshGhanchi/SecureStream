name: compose-smoke

# Builds and starts the whole local stack and fails unless every service
# reports healthy. Catches broken Dockerfiles, compose wiring and healthchecks.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docker-compose.yml"
      - "**/Dockerfile"
      - "**/requirements.txt"
      - "**/package-lock.json"
      - "keycloak/**"
      - ".github/workflows/compose-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Start stack and wait for healthy
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Probe endpoints
        run: |
          curl -fsS http://localhost:8001/ready
          curl -fsS http://localhost:8000/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8001/auth/anything)" = "401"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
