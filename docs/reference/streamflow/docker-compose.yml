services:
  db:
    container_name: db
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    command: postgres -c wal_level=logical

  api:
    container_name: backend
    build: 
      context: ./core-backend
      dockerfile: Dockerfile.dev
    user: "node"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_RAW_BUCKET: ${S3_RAW_BUCKET}
      S3_HLS_BUCKET: ${S3_HLS_BUCKET}
      AWS_REGION: ${AWS_REGION}
      CORS_ORIGIN: ${CORS_ORIGIN}
      #development only - these point to minio, in production they should point to real s3 or be left undefined to use AWS SDK defaults
      AWS_ENDPOINT: ${AWS_ENDPOINT}
      AWS_PRESIGN_ENDPOINT: ${AWS_PRESIGN_ENDPOINT}
    volumes:
      - ./core-backend:/app
      - /app/node_modules
    depends_on:
      - db

  keycloak:
    image: keycloak/keycloak:26.6.1
    container_name: keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    command: start-dev --import-realm
    depends_on:
      - db
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    environment:
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  # 1. THE VAULT (Runs forever)
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # 2. THE LOCKSMITH (Runs once, then goes to sleep)
  minio-setup:
    image: minio/mc
    container_name: minio-setup
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_RAW_BUCKET: ${S3_RAW_BUCKET}
      S3_HLS_BUCKET: ${S3_HLS_BUCKET}
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to wake up...';
      until /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do
      echo 'MinIO not ready yet, trying again in 2 seconds...';
      sleep 2;
      done;
      echo 'MinIO is awake! Creating buckets...';
      /usr/bin/mc mb myminio/${S3_RAW_BUCKET} --ignore-existing;
      /usr/bin/mc mb myminio/${S3_HLS_BUCKET} --ignore-existing;
      /usr/bin/mc anonymous set public myminio/${S3_HLS_BUCKET};
      echo 'Automation complete. Locksmith going to sleep.';
      exit 0;
      "

  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
  
  kafka-init:
    image: apache/kafka:4.2.0
    container_name: kafka-init
    depends_on:
      - kafka
    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic db.public.Video --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic video.uploaded --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic video.processed --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic video.failed --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic user.created --partitions 1 --replication-factor 1 &&
      echo 'All topics created'
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080" 
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094

  connect:
    image: quay.io/debezium/connect:3.5
    container_name: connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9094
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      - kafka
      - db

  connect-init:
    image: alpine:latest
    container_name: connect-init
    depends_on:
      - connect
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    entrypoint: >
      /bin/sh -c '
      apk add --no-cache curl &&
      echo "Waiting for Debezium to wake up..." &&
      while ! curl -s -f http://connect:8083/connectors > /dev/null; do 
        echo "Debezium not ready, trying again in 3 seconds...";
        sleep 3; 
      done &&
      echo "Debezium is awake! Registering Postgres connector..." &&
      curl -X POST -H "Content-Type: application/json" http://connect:8083/connectors -d "{
        \"name\": \"video-connector\",
        \"config\": {
          \"connector.class\": \"io.debezium.connector.postgresql.PostgresConnector\",
          \"database.hostname\": \"db\",
          \"database.port\": \"5432\",
          \"database.user\": \"${POSTGRES_USER}\",
          \"database.password\": \"${POSTGRES_PASSWORD}\",
          \"database.dbname\": \"${POSTGRES_DB}\",
          \"database.server.name\": \"postgres\",
          \"table.include.list\": \"public.Video\",
          \"plugin.name\": \"pgoutput\",
          \"topic.prefix\": \"db\"
        }
      }" &&
      echo "Automation complete. Locksmith going to sleep."
      '

volumes:
  pgdata:
  minio_data:
  kafka_data: