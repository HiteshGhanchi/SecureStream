apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-processor
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-processor
  template:
    metadata:
      labels:
        app: video-processor
    spec:
      serviceAccountName: backend-sa
      containers:
        - name: processor
          image: <AWS_ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/streamflow-video-processor:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: processor-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"